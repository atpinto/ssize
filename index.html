<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample size and power</title>
<meta name="description" content="Sample size and power for two-arm randomised trials: continuous, binary, odds ratio, relative risk, hazard ratio, RMST and count outcomes, by formula or simulation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23172031'/%3E%3Cpath d='M6 24c6 0 6-15 10-15s4 15 10 15' stroke='%23FF7247' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Same visual system as the propensity score simulation */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#172031; --muted:#5B6576; --faint:#C6CED9; --grid:#E4E8EE; --soft:#F1F4F8;
  --trt:#D6431B; --ctl:#2B67AC;
  --warn-bg:#FFF4DE; --warn:#7A5200; --err-bg:#FDECEA; --err:#B42318;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --ink:#E6EBF2; --muted:#94A0B1; --faint:#3A4555; --grid:#222B37; --soft:#1E2733;
  --trt:#FF7247; --ctl:#6BA6EC; --warn-bg:#2A2314; --warn:#F0C674; --err-bg:#2D1A1A; --err:#FF9C92; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --ink:#E6EBF2; --muted:#94A0B1; --faint:#3A4555; --grid:#222B37; --soft:#1E2733;
  --trt:#FF7247; --ctl:#6BA6EC; --warn-bg:#2A2314; --warn:#F0C674; --err-bg:#2D1A1A; --err:#FF9C92; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4}
[hidden]{display:none!important}
a{color:var(--ctl)}
.wrap{max-width:1200px;margin:0 auto;padding-block:18px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,3.2vw,2.4rem);letter-spacing:-.015em;margin:0;line-height:1.05;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:1.02rem}
.languages{display:flex;gap:4px}
.lang{padding:5px;border:1px solid transparent;border-radius:6px;background:transparent;line-height:0;opacity:.5;cursor:pointer}
.lang:hover{opacity:1}
.lang[aria-pressed="true"]{opacity:1;border-color:var(--faint)}
.lang svg{width:30px;height:20px;border-radius:2px;box-shadow:0 0 0 1px rgba(23,32,49,.18)}

/* outcome bar: pill chips like the step bar */
.outcomes{display:flex;gap:6px;flex-wrap:wrap}
.chip,.seg button,.btn,.run{font:700 .95rem var(--f-body);cursor:pointer;color:var(--muted);background:var(--surface);border:1px solid var(--faint)}
.chip{padding:6px 14px 6px 6px;border-radius:999px;display:flex;gap:8px;align-items:center;text-align:left}
.chip .g{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);flex:none}
.chip .g svg{width:17px;height:17px;display:block}
.chip .nm{display:block;line-height:1.1}
.chip .sb{display:block;font-weight:400;font-size:.76rem;line-height:1.15;opacity:.85}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .g{background:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ctl);outline-offset:2px}

.main{display:grid;grid-template-columns:350px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:16px;min-width:0}
.card>h2,.card summary{font:700 .78rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card>h2 .t{color:var(--ink)}

/* form */
.form-body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .flab{font-size:.9rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hint{font-weight:400;font-size:.8rem;color:var(--muted)}
input[type=number],select{font:500 .95rem var(--f-mono);padding:8px 10px;border:1px solid var(--faint);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--faint);border-radius:999px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;padding:7px 10px;font-size:.88rem;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
fieldset.grp{border:1px solid var(--grid);border-radius:12px;padding:8px 12px 12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
fieldset.grp legend{font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;font-weight:700;color:var(--muted)}
.switch-row input{width:20px;height:20px;accent-color:var(--ink)}
.rho-wrap{display:flex;align-items:center;gap:10px}
.rho-wrap input{flex:1;accent-color:var(--ink)}
.rho-wrap output{font:500 .85rem var(--f-mono);color:var(--ink);min-width:2.6em;text-align:right}
.run{background:var(--ink);color:var(--bg);border-color:var(--ink);border-radius:999px;padding:11px 16px;font-size:1rem}
.run:disabled{opacity:.55;cursor:wait}
.progress{height:6px;border-radius:99px;background:var(--grid);overflow:hidden;display:none}
.progress.on{display:block}
.progress i{display:block;height:100%;width:0;background:var(--trt);transition:width .1s}
.err{display:none;color:var(--err);background:var(--err-bg);border-radius:10px;padding:9px 11px;font-size:.9rem}
.err.on{display:block}

/* results */
.results{display:flex;flex-direction:column;gap:14px;min-width:0}
.res-empty{padding:44px 24px;text-align:center;color:var(--muted)}
.res-empty .big{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--ink);margin-bottom:6px}
.headline{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:stretch}
@media (max-width:640px){.headline{grid-template-columns:1fr}}
.n-block{padding:18px 22px;border-right:1px solid var(--grid);display:flex;flex-direction:column;justify-content:center;min-width:210px}
@media (max-width:640px){.n-block{border-right:0;border-bottom:1px solid var(--grid)}}
.lab{font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.N{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.N .nsym{font-family:var(--f-mono);font-weight:500;font-size:1.3rem;color:var(--muted);margin-right:8px;vertical-align:.5em}
.after{font-size:.9rem;color:var(--muted);margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 0;padding:10px 6px}
.stat{padding:8px 14px}
.stat .val{font:500 1.3rem var(--f-mono);font-variant-numeric:tabular-nums;margin-top:2px}
.stat .val small{font-size:.75rem;color:var(--muted)}
.stat .val.ctrl{color:var(--ctl)} .stat .val.trt{color:var(--trt)}
.formula-strip{font:500 .8rem var(--f-mono);color:var(--muted);background:var(--soft);border-top:1px solid var(--grid);padding:10px 16px;overflow-x:auto;white-space:nowrap;border-radius:0 0 16px 16px}
.formula-strip b{color:var(--ink)}
.warn-note{margin:0 16px 12px;padding:9px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.88rem}
.chart-box{padding:4px 14px 4px;height:320px;position:relative}
.chart-note{padding:2px 16px 14px;font-size:.85rem;color:var(--muted)}
.cov-body{padding:4px 16px 16px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:640px){.cov-body{grid-template-columns:1fr}}
.cov-chart-box{height:190px;position:relative}
.cov-read{font-size:.95rem}
.delta{font:800 2rem var(--f-display);color:var(--trt)}
.small{font-size:.82rem;color:var(--muted);margin-top:8px}
.paper-text{margin:0 16px 16px;padding:14px 16px;background:var(--soft);border-radius:12px;font-size:1rem;line-height:1.6}
.btn{padding:5px 12px;border-radius:999px;font-size:.82rem;letter-spacing:0;text-transform:none}
details.methods summary{cursor:pointer;list-style:none;padding-bottom:14px;justify-content:flex-start}
details.methods summary::-webkit-details-marker{display:none}
details.methods summary::before{content:"▸";transition:transform .15s}
details.methods[open] summary::before{transform:rotate(90deg)}
.m-body{padding:0 16px 16px;font-size:.92rem;display:flex;flex-direction:column;gap:2px;max-width:75ch}
.m-body p{margin:0 0 8px}
.foot{font-size:.8rem;color:var(--muted);text-align:center;margin:6px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="h1">Sample size and power</h1><p class="sub" id="sub"></p></div>
    <span class="languages" role="group" aria-label="Language">
      <button type="button" class="lang" data-lang="en" lang="en" aria-label="English" title="English"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="uk-cross"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><path d="M0 0h60v30H0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#uk-cross)" stroke="#c8102e" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6"/></svg></button>
      <button type="button" class="lang" data-lang="es" lang="es" aria-label="Español" title="Español"><svg viewBox="0 0 3 2" aria-hidden="true"><path d="M0 0h3v2H0z" fill="#aa151b"/><path d="M0 .5h3v1H0z" fill="#f1bf00"/></svg></button>
      <button type="button" class="lang" data-lang="pt" lang="pt" aria-label="Português" title="Português"><svg viewBox="0 0 600 400" aria-hidden="true"><path d="M0 0h600v400H0z" fill="#da291c"/><path d="M0 0h240v400H0z" fill="#046a38"/><circle cx="240" cy="200" r="80" fill="none" stroke="#ffe900" stroke-width="18"/><path d="M205 150h70v60a35 35 0 0 1-70 0z" fill="#fff" stroke="#da291c" stroke-width="12"/></svg></button>
    </span>
  </header>
  <nav class="outcomes" id="nav" aria-label="Outcome type"></nav>
  <div class="main">
    <section class="card" id="inputsCard">
      <h2><span id="inputsLab">Inputs</span><span class="t" id="panelTitle"></span></h2>
      <div class="form-body" id="form"></div>
    </section>
    <section class="results" id="results"></section>
  </div>
  <p class="foot" id="foot"></p>
</div>
<script>
/* ================= math utilities ================= */
function qnorm(p){ // Acklam inverse normal CDF
  if(p<=0) return -Infinity; if(p>=1) return Infinity;
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00],
        b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01],
        c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00],
        d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p<=1-pl){q=p-0.5;r=q*q;return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
  q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
function pnorm(z){
  if(z<-8)return 0; if(z>8)return 1;
  const x=Math.abs(z)/Math.SQRT2, t=1/(1+0.3275911*x);
  const y=t*(0.254829592+t*(-0.284496736+t*(1.421413741+t*(-1.453152027+t*1.061405429))))*Math.exp(-x*x);
  return z>=0?1-0.5*y:0.5*y;
}
function tinv(p,df){ // Cornish-Fisher expansion of Student-t quantile
  if(df>2000) return qnorm(p);
  const z=qnorm(p),z2=z*z,z3=z2*z,z5=z3*z2,z7=z5*z2,z9=z7*z2;
  return z+(z3+z)/(4*df)+(5*z5+16*z3+3*z)/(96*df*df)+(3*z7+19*z5+17*z3-15*z)/(384*df**3)
        +(79*z9+776*z7+1482*z5-1920*z3-945*z)/(92160*df**4);
}
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeRng(seed){
  const u=mulberry32(seed); let spare=null;
  return {
    unif:()=>u()||1e-12,
    norm:function(){ if(spare!==null){const s=spare;spare=null;return s;}
      let a=u()||1e-12,b=u();const R=Math.sqrt(-2*Math.log(a));
      spare=R*Math.sin(2*Math.PI*b); return R*Math.cos(2*Math.PI*b); },
    pois:function(m){ if(m<=0)return 0;
      if(m<30){const L=Math.exp(-m);let k=0,p=1;do{k++;p*=u();}while(p>L);return k-1;}
      return Math.max(0,Math.round(m+Math.sqrt(m)*this.norm()));},
    gamma:function(shape){ // Marsaglia-Tsang, mean = shape
      if(shape<1){return this.gamma(shape+1)*Math.pow(u()||1e-12,1/shape);}
      const d=shape-1/3,c=1/Math.sqrt(9*d);
      for(;;){let x,v;do{x=this.norm();v=1+c*x;}while(v<=0);
        v=v*v*v;const uu=u()||1e-12;
        if(Math.log(uu)<0.5*x*x+d-d*v+d*Math.log(v))return d*v;}
    }
  };
}
const fmt=(x,d=3)=>!isFinite(x)?"—":(Math.abs(x)>=100?x.toFixed(Math.max(0,d-2)):x.toFixed(d));
const pct=(x,d=1)=>(100*x).toFixed(d)+"%";

/* ================= shared design helpers ================= */
function zAlpha(P){ return P.design==="ni" ? qnorm(1-P.alpha) : qnorm(1-P.alpha/2); }
function ceilPair(n1,r){ n1=Math.max(2,Math.ceil(n1)); const n2=Math.max(2,Math.ceil(n1*r)); return {n1,n2,N:n1+n2}; }
function solveNGeneric(P,powerFn){ // monotone search on n1
  let lo=2, hi=4;
  while(powerFn(hi,P)<P.targetPower && hi<4e6) hi*=2;
  if(hi>=4e6) return null;
  for(let i=0;i<60;i++){const mid=(lo+hi)/2; (powerFn(mid,P)<P.targetPower)?lo=mid:hi=mid;}
  return hi;
}

/* ================= analytic power per outcome (n1 = control arm size) ================= */
function powContinuous(n1,P){
  const n2=n1*P.ratio, za=zAlpha(P);
  const eff=P.design==="ni"?(P.mu2-P.mu1)+P.margin:Math.abs(P.mu2-P.mu1);
  const sd=P.covAnalytic?P.sd*Math.sqrt(1-P.rho*P.rho):P.sd;
  if(eff<=0)return 0;
  return pnorm(eff/(sd*Math.sqrt(1/n1+1/n2))-za);
}
function powBinary(n1,P){
  const n2=n1*P.ratio, za=zAlpha(P), p1=P.p1,p2=P.p2,q1=1-p1,q2=1-p2;
  if(P.design==="ni"){
    const eff=(p2-p1)+P.margin; if(eff<=0)return 0;
    return pnorm(eff/Math.sqrt(p1*q1/n1+p2*q2/n2)-za);
  }
  const pb=(n1*p1+n2*p2)/(n1+n2), qb=1-pb, d=Math.abs(p1-p2);
  return pnorm((d-za*Math.sqrt(pb*qb*(1/n1+1/n2)))/Math.sqrt(p1*q1/n1+p2*q2/n2));
}
function powOR(n1,P){
  const n2=n1*P.ratio, za=zAlpha(P), p1=P.p1, p2=P.p2;
  const se=Math.sqrt(1/(n1*p1*(1-p1))+1/(n2*p2*(1-p2)));
  return pnorm(Math.abs(Math.log(P.or))/se-za);
}
function powRR(n1,P){
  const n2=n1*P.ratio, za=zAlpha(P), p1=P.p1, p2=P.p2;
  const se=Math.sqrt((1-p1)/(n1*p1)+(1-p2)/(n2*p2));
  return pnorm(Math.abs(Math.log(P.rr))/se-za);
}
function hrEventProb(lam,a,f){ if(lam<=0)return 0; return 1-(Math.exp(-lam*f)-Math.exp(-lam*(a+f)))/(lam*a); }
function powHR(n1,P){
  const n2=n1*P.ratio, za=zAlpha(P);
  const l1=Math.LN2/P.med1, l2=l1*P.hr;
  const D=n1*hrEventProb(l1,P.acc,P.fup)+n2*hrEventProb(l2,P.acc,P.fup);
  const pi1=n1/(n1+n2), pi2=1-pi1;
  return pnorm(Math.abs(Math.log(P.hr))*Math.sqrt(D*pi1*pi2)-za);
}
function rmstMu(lam,tau){ return (1-Math.exp(-lam*tau))/lam; }
function rmstAsyVar(lam,tau,a,f){ // Var of sqrt(n)*(muhat-mu), exponential + uniform accrual censoring
  const M=800,h=tau/M; let v=0;
  const S=t=>Math.exp(-lam*t);
  const m=t=>(Math.exp(-lam*t)-Math.exp(-lam*tau))/lam;
  const G=t=>t<=f?1:(t>=a+f?0:(a+f-t)/a);
  for(let i=0;i<M;i++){const t=(i+0.5)*h,g=G(t); if(g<=0)continue;
    v+=m(t)*m(t)*lam/(S(t)*g)*h;}
  return v;
}
function powRMST(n1,P){
  const n2=n1*P.ratio, za=zAlpha(P);
  const l1=Math.LN2/P.med1, l2=Math.LN2/P.med2;
  const d=Math.abs(rmstMu(l2,P.tau)-rmstMu(l1,P.tau));
  const v1=rmstAsyVar(l1,P.tau,P.acc,P.fup), v2=rmstAsyVar(l2,P.tau,P.acc,P.fup);
  if(d<=0)return 0;
  return pnorm(d/Math.sqrt(v1/n1+v2/n2)-za);
}
function powCount(n1,P){
  const n2=n1*P.ratio, za=zAlpha(P);
  const l1=P.rate0,l2=P.rate0*P.rr,t=P.expo,k=P.disp;
  const v1=1/(l1*t)+k, v2=1/(l2*t)+k;
  return pnorm(Math.abs(Math.log(P.rr))/Math.sqrt(v1/n1+v2/n2)-za);
}

/* ================= small linear algebra ================= */
function solve3(A,b){ // 3x3 gaussian elimination with partial pivot
  const M=[[...A[0],b[0]],[...A[1],b[1]],[...A[2],b[2]]];
  for(let c=0;c<3;c++){
    let p=c;for(let r=c+1;r<3;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
    if(Math.abs(M[p][c])<1e-12)return null;
    [M[c],M[p]]=[M[p],M[c]];
    for(let r=0;r<3;r++){if(r===c)continue;const fct=M[r][c]/M[c][c];

 M:{cont:`<p><strong>Formula.</strong> Two-sample normal approximation for a difference in means with unequal allocation; superiority uses two-sided α, non-inferiority tests H₀: μ<sub>T</sub>−μ<sub>C</sub> ≤ −m at one-sided α (higher assumed better).</p>

bin:`<p><strong>Formula.</strong> Two-proportion z-test with the pooled-variance null (superiority) or unpooled Wald with a shifted null (non-inferiority, risk-difference scale, higher p = better).</p>
<p><strong>Simulation.</strong> Outcomes are generated from a latent-probit model: Y = 1 if ρX + √(1−ρ²)Z falls below Φ⁻¹(p<sub>arm</sub>), so ρ is the latent-scale (biserial) correlation between covariate and outcome — the observable point-biserial correlation is smaller. Adjusted analysis is logistic regression (Wald test on the arm coefficient). The gain from adjustment is smaller than for continuous outcomes and works through non-collapsibility: adjustment moves the OR away from 1 rather than shrinking the SE.</p>`,
or:`<p><strong>Formula.</strong> Wald test on log OR; p₂ is derived from the control proportion and the OR. Sample size uses Var(ln OR) ≈ 1/(n₁p₁q₁) + 1/(n₂p₂q₂).</p>
<p><strong>Simulation.</strong> Same latent-probit generation as the binary outcome; unadjusted analysis is the 2×2 Wald log-OR (with a 0.5 continuity correction if a cell is empty), adjusted analysis is logistic regression. The conditional (adjusted) OR is larger in magnitude than the marginal OR — non-collapsibility — so power can change even though the covariate is balanced by randomisation.</p>`,
rr:`<p><strong>Formula.</strong> Wald test on log RR; p₂ = RR·p₁ (must be below 1). Sample size uses the delta-method variance Var(ln RR) ≈ q₁/(n₁p₁) + q₂/(n₂p₂).</p>
<p><strong>Simulation.</strong> Same latent-probit generation as the binary outcome; unadjusted analysis is the 2×2 Wald log-RR (0.5 added to each event count and 1 to each arm size if any arm has zero or all events), adjusted analysis is modified Poisson regression — log link with a robust sandwich variance (Zou 2004), which avoids the convergence failures of log-binomial models. Unlike the OR, the RR is collapsible, so adjustment works mainly through variance reduction; under the latent-probit model the covariate-conditional RR is not exactly constant, so treat the adjusted power as indicative.</p>`,
hr:`<p><strong>Formula.</strong> Schoenfeld's events formula D = (z<sub>1−α/2</sub>+z<sub>1−β</sub>)²/(π₁π₂ ln²HR), converted to N via event probabilities under exponential survival, uniform accrual over the accrual period, and administrative censoring at accrual + follow-up.</p>
<p><strong>Simulation.</strong> Exponential event times with staggered entry; unadjusted analysis is the log-rank test, adjusted analysis a two-covariate Cox model (Breslow ties, Newton–Raphson). The covariate acts multiplicatively on the hazard with coefficient calibrated so that corr(X, log T) = ρ; the entered HR is the covariate-conditional HR, so the unadjusted (marginal) HR is attenuated toward 1 — this is why the adjusted Cox analysis can be visibly more powerful.</p>`,

 M:{cont:`<p><strong>Fórmula.</strong> Aproximación normal para la diferencia de dos medias con asignación desigual; la superioridad usa α bilateral y la no inferioridad contrasta H₀: μ<sub>T</sub>−μ<sub>C</sub> ≤ −m con α unilateral (valores más altos son mejores).</p>
<p><strong>Simulación.</strong> Desenlaces normales analizados con la prueba t de Welch. Con la covariable basal activada, (X, Y) son normales bivariantes con correlación ρ y el análisis ajustado es un ANCOVA (Y ~ grupo + X). La DE residual se reduce en un factor √(1−ρ²), que es exactamente la ganancia de la fórmula: la curva ANCOVA analítica discontinua se superpone para comprobar que la simulación coincide.</p>`,
bin:`<p><strong>Fórmula.</strong> Prueba z para dos proporciones con varianza combinada bajo la hipótesis nula (superioridad) o prueba de Wald no combinada con nula desplazada (no inferioridad, escala de diferencia de riesgos, p más alta = mejor).</p>
<p><strong>Simulación.</strong> Los desenlaces se generan con un modelo probit latente: Y = 1 si ρX + √(1−ρ²)Z es menor que Φ⁻¹(p<sub>grupo</sub>), de modo que ρ es la correlación en la escala latente (biserial) entre covariable y desenlace; la correlación punto-biserial observable es menor. El análisis ajustado es una regresión logística (prueba de Wald sobre el coeficiente del grupo). La ganancia por el ajuste es menor que en desenlaces continuos y actúa a través de la no colapsabilidad: el ajuste aleja la OR de 1 en lugar de reducir el error estándar.</p>`,
or:`<p><strong>Fórmula.</strong> Prueba de Wald sobre log OR; p₂ se deriva de la proporción del control y la OR. El tamaño muestral usa Var(ln OR) ≈ 1/(n₁p₁q₁) + 1/(n₂p₂q₂).</p>
<p><strong>Simulación.</strong> Misma generación probit latente que el desenlace binario; el análisis sin ajustar es el log-OR de Wald de la tabla 2×2 (con corrección de continuidad de 0.5 si una celda está vacía) y el ajustado es una regresión logística. La OR condicional (ajustada) es de mayor magnitud que la OR marginal —no colapsabilidad—, por lo que la potencia puede cambiar aunque la aleatorización equilibre la covariable.</p>`,
rr:`<p><strong>Fórmula.</strong> Prueba de Wald sobre log RR; p₂ = RR·p₁ (debe ser menor que 1). El tamaño muestral usa la varianza por el método delta Var(ln RR) ≈ q₁/(n₁p₁) + q₂/(n₂p₂).</p>
<p><strong>Simulación.</strong> Misma generación probit latente que el desenlace binario; el análisis sin ajustar es el log-RR de Wald de la tabla 2×2 (se suma 0.5 a cada número de eventos y 1 a cada tamaño de grupo si algún grupo no tiene eventos o los tiene todos) y el ajustado es una regresión de Poisson modificada —enlace logarítmico con varianza sándwich robusta (Zou 2004)—, que evita los fallos de convergencia de los modelos log-binomiales. A diferencia de la OR, el RR es colapsable, así que el ajuste actúa sobre todo reduciendo la varianza; con el modelo probit latente el RR condicional no es exactamente constante, por lo que la potencia ajustada es orientativa.</p>`,
hr:`<p><strong>Fórmula.</strong> Fórmula de eventos de Schoenfeld D = (z<sub>1−α/2</sub>+z<sub>1−β</sub>)²/(π₁π₂ ln²HR), convertida a N mediante las probabilidades de evento bajo supervivencia exponencial, reclutamiento uniforme durante el periodo de reclutamiento y censura administrativa al final del reclutamiento + seguimiento.</p>
<p><strong>Simulación.</strong> Tiempos de evento exponenciales con entrada escalonada; el análisis sin ajustar es la prueba de log-rank y el ajustado un modelo de Cox con dos covariables (empates de Breslow, Newton–Raphson). La covariable actúa multiplicativamente sobre el riesgo con un coeficiente calibrado para que corr(X, log T) = ρ; el HR introducido es el HR condicional a la covariable, de modo que el HR sin ajustar (marginal) se atenúa hacia 1, y por eso el análisis de Cox ajustado puede ser claramente más potente.</p>`,
rmst:`<p><strong>Fórmula.</strong> Diferencia en el tiempo medio de supervivencia restringido hasta τ bajo supervivencia exponencial. La varianza asintótica del RMST de Kaplan–Meier, ∫₀^τ [∫<sub>t</sub>^τ S]² dΛ/(S·G), se integra numéricamente, con G(t) la supervivencia de la censura implicada por el reclutamiento uniforme más la censura administrativa.</p>
<p><strong>Simulación.</strong> RMST de Kaplan–Meier en cada grupo con la varianza estándar (tipo Greenwood) y una prueba z sobre la diferencia, es decir, el análisis sin ajustar de Royston–Parmar / Uno y colaboradores. El ajuste por covariables (p. ej., mediante pseudoobservaciones) no está implementado para el RMST.</p>`,
count:`<p><strong>Fórmula.</strong> Prueba de Wald sobre el logaritmo de la razón de tasas con Var(ln λ̂) ≈ (1/(λt)+k)/n por grupo, donde k es la dispersión binomial negativa (k = 0 equivale a Poisson).</p>
<p><strong>Simulación.</strong> Los recuentos se generan como Poisson–gamma (binomial negativa); la prueba es una z robusta por el método delta sobre el logaritmo del cociente de recuentos medios con varianzas empíricas, por lo que sigue siendo válida con sobredispersión.</p>`,
mc:`<p><strong>Error de Monte Carlo.</strong> La potencia simulada se presenta con un intervalo binomial del 95%; con 1000 réplicas, la semiamplitud cerca del 80% de potencia es de unos ±2.5 puntos porcentuales. Fije la semilla para que los resultados sean reproducibles.</p>`}

count:`<p><strong>Fórmula.</strong> Teste de Wald sobre o logaritmo da razão de taxas com Var(ln λ̂) ≈ (1/(λt)+k)/n por grupo, onde k é a dispersão binomial negativa (k = 0 corresponde a Poisson).</p>
<p><strong>Simulação.</strong> As contagens são geradas como Poisson–gama (binomial negativa); o teste é um z robusto pelo método delta sobre o logaritmo da razão das contagens médias com variâncias empíricas, pelo que se mantém válido com sobredispersão.</p>`,
mc:`<p><strong>Erro de Monte Carlo.</strong> A potência simulada é apresentada com um intervalo binomial a 95%; com 1000 réplicas, a semiamplitude perto de 80% de potência é de cerca de ±2.5 pontos percentuais. Fixe a semente para tornar os resultados reprodutíveis.</p>`}
}};
</script>
<script>
/* ================= outcome configuration ================= */
const G={
cont:'<svg viewBox="0 0 20 20" fill="none"><path d="M1 17c4 0 5-13 9-13s5 13 9 13" style="stroke:var(--ctl)" stroke-width="1.8" stroke-linecap="round"/></svg>',
bin:'<svg viewBox="0 0 20 20"><circle cx="6" cy="10" r="4.4" style="fill:var(--ctl)"/><circle cx="14.6" cy="10" r="4.4" fill="none" style="stroke:var(--trt)" stroke-width="1.8"/></svg>',
or:'<svg viewBox="0 0 20 20"><rect x="2" y="2" width="7" height="7" rx="1.5" style="fill:var(--ctl)"/><rect x="11" y="2" width="7" height="7" rx="1.5" fill="none" style="stroke:var(--trt)" stroke-width="1.6"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="none" style="stroke:var(--ctl)" stroke-width="1.6"/><rect x="11" y="11" width="7" height="7" rx="1.5" style="fill:var(--trt)"/></svg>',
rr:'<svg viewBox="0 0 20 20"><rect x="3" y="9" width="5.5" height="9" rx="1.5" style="fill:var(--ctl)"/><rect x="11.5" y="3" width="5.5" height="15" rx="1.5" fill="none" style="stroke:var(--trt)" stroke-width="1.6"/></svg>',
hr:'<svg viewBox="0 0 20 20" fill="none"><path d="M2 3h5v4h4v5h4v5h3" style="stroke:var(--ctl)" stroke-width="1.8"/><path d="M2 3h3v7h5v6h8" style="stroke:var(--trt)" stroke-width="1.8" stroke-dasharray="3 2"/></svg>',
rmst:'<svg viewBox="0 0 20 20"><path d="M2 4h5v4h4v5h4v4H2z" style="fill:var(--trt)" opacity=".25"/><path d="M2 4h5v4h4v5h4v4" style="stroke:var(--trt)" stroke-width="1.8" fill="none"/></svg>',
count:'<svg viewBox="0 0 20 20" style="fill:var(--ctl)"><circle cx="4" cy="15" r="1.8"/><circle cx="9" cy="7" r="1.8"/><circle cx="12" cy="13" r="1.8" style="fill:var(--trt)"/><circle cx="16" cy="5" r="1.8" style="fill:var(--trt)"/><circle cx="6" cy="4" r="1.8"/><circle cx="16" cy="16" r="1.8" style="fill:var(--trt)"/></svg>'
};
const OUT=[
{id:'cont',ni:true,cov:true,fields:[{id:'mu1',v:0,step:0.1},{id:'mu2',v:0.5,step:0.1},{id:'sd',v:1,step:0.1,min:1e-9},{id:'margin',v:0.3,step:0.05,min:1e-9,ni:true}]},
{id:'bin',ni:true,cov:true,fields:[{id:'p1',v:0.30,step:0.01,min:0.001,max:0.999},{id:'p2',v:0.45,step:0.01,min:0.001,max:0.999},{id:'margin',v:0.10,step:0.01,min:1e-9,ni:true}]},
{id:'or',ni:false,cov:true,fields:[{id:'p1',v:0.30,step:0.01,min:0.001,max:0.999},{id:'or',v:2.0,step:0.1,min:1e-6}]},
{id:'rr',ni:false,cov:true,fields:[{id:'p1',v:0.30,step:0.01,min:0.001,max:0.999},{id:'rr',v:1.5,step:0.1,min:1e-6}]},
{id:'hr',ni:false,cov:true,fields:[{id:'hr',v:0.70,step:0.05,min:1e-6},{id:'med1',v:12,step:1,min:1e-9},{id:'acc',v:24,step:1,min:1e-9},{id:'fup',v:12,step:1,min:0}]},
{id:'rmst',ni:false,cov:false,fields:[{id:'med1',v:12,step:1,min:1e-9},{id:'med2',v:18,step:1,min:1e-9},{id:'tau',v:24,step:1,min:1e-9},{id:'acc',v:24,step:1,min:1e-9},{id:'fup',v:12,step:1,min:0}]},
{id:'count',ni:false,cov:false,fields:[{id:'rate0',v:1.2,step:0.1,min:1e-9},{id:'rr',v:0.70,step:0.05,min:1e-6},{id:'expo',v:1,step:0.5,min:1e-9},{id:'disp',v:0.5,step:0.1,min:0}]}
];

/* persistent state */
const S={outcome:'cont',method:'formula',solve:'n',design:'sup',
 alpha:0.05,targetPower:0.80,Ntotal:120,ratio:1,dropout:10,nsim:1000,seed:'',
 covOn:false,rho:0.5,vals:{}};
OUT.forEach(o=>{S.vals[o.id]={};o.fields.forEach(f=>S.vals[o.id][f.id]=f.v);});
function storedLang(){try{return localStorage.getItem('ssize-lang')}catch(e){return null}}
let lang=[new URLSearchParams(location.search).get('lang'),storedLang()].find(c=>c in I18N)||'en';
const L=()=>I18N[lang];
let lastR=null;

/* ================= form rendering ================= */
const $=id=>document.getElementById(id);
function segHTML(id,opts,cur){
  return `<div class="seg" role="group" id="${id}">`+opts.map(o=>
   `<button type="button" data-v="${o.v}" aria-pressed="${o.v===cur}">${o.t}</button>`).join('')+`</div>`;
}
function fieldHTML(o,f,val){
  const [lab,hint]=L().fld[o.id+'.'+f.id];
  return `<div class="field"><label for="f_${f.id}">${lab}${hint?`<span class="hint">${hint}</span>`:''}</label>
  <input type="number" id="f_${f.id}" value="${val}" step="${f.step||'any'}" ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''}></div>`;
}
function renderForm(){
  const o=OUT.find(x=>x.id===S.outcome),T=L();
  $('panelTitle').textContent=T.out[o.id][0];
  const V=S.vals[o.id];
  let h='';
  if(o.ni)h+=`<div class="field"><span class="flab">${T.hyp}</span>${segHTML('segDesign',[{v:'sup',t:T.sup},{v:'ni',t:T.ni}],S.design)}</div>`;
  h+=o.fields.filter(f=>!f.ni||S.design==='ni').map(f=>fieldHTML(o,f,V[f.id])).join('');
  h+=`<fieldset class="grp"><legend>${T.ea}</legend>
   <div class="row2">
    <div class="field"><label for="f_alpha">α <span class="hint">${S.design==='ni'&&o.ni?T.one:T.two}</span></label>
      <input type="number" id="f_alpha" value="${S.alpha}" step="0.01" min="0.0001" max="0.3"></div>
    ${S.solve==='n'
      ?`<div class="field"><label for="f_pow">${T.tpow}</label><input type="number" id="f_pow" value="${S.targetPower}" step="0.05" min="0.1" max="0.999"></div>`
      :`<div class="field"><label for="f_N">${T.Ntot}</label><input type="number" id="f_N" value="${S.Ntotal}" step="2" min="4"></div>`}
   </div>
   <div class="row2">
    <div class="field"><label for="f_ratio">${T.alloc}</label><input type="number" id="f_ratio" value="${S.ratio}" step="0.25" min="0.2" max="5"></div>
    ${S.solve==='n'?`<div class="field"><label for="f_drop">${T.drop}<span class="hint">${T.dropH}</span></label><input type="number" id="f_drop" value="${S.dropout}" step="5" min="0" max="60"></div>`:'<div></div>'}
   </div>
   <div class="field"><span class="flab">${T.solve}</span>${segHTML('segSolve',[{v:'n',t:T.sN},{v:'power',t:T.sP}],S.solve)}</div>
  </fieldset>`;
  h+=`<div class="field"><span class="flab">${T.meth}</span>${segHTML('segMethod',[{v:'formula',t:T.formula},{v:'sim',t:T.sim}],S.method)}</div>`;
  if(S.method==='sim'){
    h+=`<fieldset class="grp"><legend>${T.mc}</legend>
     <div class="row2">
      <div class="field"><label for="f_nsim">${T.reps}</label><select id="f_nsim">${[500,1000,2000,5000].map(k=>`<option ${k===S.nsim?'selected':''}>${k}</option>`).join('')}</select></div>
      <div class="field"><label for="f_seed">${T.seed}<span class="hint">${T.seedH}</span></label><input type="number" id="f_seed" value="${S.seed}" step="1"></div>
     </div></fieldset>`;
    if(o.cov&&S.design==='sup'){
      h+=`<fieldset class="grp"><legend>${T.cov}</legend>
       <label class="switch-row" for="f_cov"><span>${T.covAdj}</span><input type="checkbox" id="f_cov" ${S.covOn?'checked':''}></label>
       <div class="field" id="rhoField" ${S.covOn?'':'hidden'}>
        <label for="f_rho">${T.rho}</label>
        <div class="rho-wrap"><input type="range" id="f_rho" min="0" max="0.9" step="0.05" value="${S.rho}"><output id="rhoVal">${S.rho.toFixed(2)}</output></div>
       </div></fieldset>`;
    } else if(o.cov&&S.design==='ni'){
      h+=`<div class="hint">${T.covNI}</div>`;
    }
  }
  h+=`<button class="run" id="btnRun" type="button">${S.solve==='n'?T.runN:T.runP}</button>
      <div class="progress" id="prog"><i id="progBar"></i></div>
      <div class="err" id="errBox" role="alert"></div>`;
  $('form').innerHTML=h;
  wireForm(o);
}
function wireForm(o){
  const bindSeg=(id,cb)=>{const el=$(id);if(!el)return;
    el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>cb(b.dataset.v)));};
  bindSeg('segDesign',v=>{S.design=v;if(v==='ni')S.covOn=false;saveInputs(o);renderForm();});
  bindSeg('segSolve',v=>{S.solve=v;saveInputs(o);renderForm();});
  bindSeg('segMethod',v=>{S.method=v;saveInputs(o);renderForm();});
  const cov=$('f_cov');
  if(cov)cov.addEventListener('change',()=>{S.covOn=cov.checked;$('rhoField').hidden=!cov.checked;});
  const rho=$('f_rho');
  if(rho)rho.addEventListener('input',()=>{S.rho=parseFloat(rho.value);$('rhoVal').textContent=S.rho.toFixed(2);});
  $('btnRun').addEventListener('click',calculate);
}
function saveInputs(o){
  o.fields.forEach(f=>{const el=$('f_'+f.id);if(el)S.vals[o.id][f.id]=parseFloat(el.value);});
  const g=(id,cur)=>{const el=$(id);return el?parseFloat(el.value):cur;};
  S.alpha=g('f_alpha',S.alpha);S.targetPower=g('f_pow',S.targetPower);
  S.Ntotal=g('f_N',S.Ntotal);S.ratio=g('f_ratio',S.ratio);S.dropout=g('f_drop',S.dropout);
  const ns=$('f_nsim');if(ns)S.nsim=parseInt(ns.value);
  const sd=$('f_seed');if(sd)S.seed=sd.value;
}
function renderNav(){
  const T=L();
  $('nav').innerHTML=OUT.map(o=>`<button class="chip" aria-pressed="${o.id===S.outcome}" data-o="${o.id}" type="button">
    <span class="g">${G[o.id]}</span><span><span class="nm">${T.out[o.id][0]}</span><span class="sb">${T.out[o.id][1]}</span></span></button>`).join('');
  $('nav').querySelectorAll('.chip').forEach(t=>t.addEventListener('click',()=>{
    saveInputs(OUT.find(x=>x.id===S.outcome));
    S.outcome=t.dataset.o;
    const o=OUT.find(x=>x.id===S.outcome);
    if(!o.ni)S.design='sup';
    if(!o.cov)S.covOn=false;
    lastR=null;
    renderNav();renderForm();renderEmpty();
  }));
}
function renderEmpty(){
  $('results').innerHTML=`<div class="card"><div class="res-empty"><div class="big">${L().empty1}</div>${L().empty2}</div></div>`;
}

/* ================= validation & parameter assembly ================= */
function buildParams(){
  const o=OUT.find(x=>x.id===S.outcome);
  saveInputs(o);
  const seedFixed=S.seed!==''&&!isNaN(parseInt(S.seed));
  const V=S.vals[o.id],P={outcome:o.id,design:o.ni?S.design:'sup',method:S.method,solve:S.solve,
    alpha:S.alpha,targetPower:S.targetPower,Ntotal:Math.round(S.Ntotal),ratio:S.ratio,
    dropout:S.solve==='n'?(S.dropout||0):0,nsim:S.nsim,
    seed:seedFixed?parseInt(S.seed):(Date.now()%2**31),
    covOn:S.method==='sim'&&o.cov&&S.design==='sup'&&S.covOn,rho:S.rho,covAnalytic:false,...V};
  const E=L().E,errs=[],warns=[];
  const bad=(c,k,arg)=>{if(c)errs.push(typeof E[k]==='function'?E[k](arg):E[k]);};
  bad(!(P.alpha>0&&P.alpha<0.3),'alpha');
  bad(S.solve==='n'&&!(P.targetPower>P.alpha&&P.targetPower<1),'pow');
  bad(S.solve==='power'&&!(P.Ntotal>=4),'N');
  bad(!(P.ratio>=0.2&&P.ratio<=5),'ratio');
  if(o.id==='cont'){
    bad(!(P.sd>0),'sd');
    if(P.design==='sup')bad(P.mu1===P.mu2,'eqMeans');
    else{bad(!(P.margin>0),'margin');bad((P.mu2-P.mu1)+P.margin<=0,'contNI');}
  }
  if(o.id==='bin'){
    bad(!(P.p1>0&&P.p1<1&&P.p2>0&&P.p2<1),'props');
    if(P.design==='sup')bad(P.p1===P.p2,'eqProps');
    else{bad(!(P.margin>0),'margin');bad((P.p2-P.p1)+P.margin<=0,'binNI');}
  }
  if(o.id==='or'){
    bad(!(P.p1>0&&P.p1<1),'p1');bad(!(P.or>0)||P.or===1,'or');
    if(P.or>0)P.p2=P.or*P.p1/(1-P.p1+P.or*P.p1);
  }
  if(o.id==='rr'){
    bad(!(P.p1>0&&P.p1<1),'p1');bad(!(P.rr>0)||P.rr===1,'rr');
    P.p2=P.rr*P.p1;
    bad(P.rr>0&&!(P.p2<1),'rrImpl',fmt(P.p2));
  }
  if(o.id==='hr'){bad(!(P.hr>0)||P.hr===1,'hr');bad(!(P.med1>0&&P.acc>0&&P.fup>=0),'hrPer');}
  if(o.id==='rmst'){
    bad(!(P.med1>0&&P.med2>0&&P.tau>0&&P.acc>0&&P.fup>=0),'rmstPer');
    bad(P.med1===P.med2,'eqMed');bad(P.tau>P.acc+P.fup+1e-9,'tau');
  }
  if(o.id==='count'){bad(!(P.rate0>0&&P.expo>0),'rate');bad(!(P.rr>0)||P.rr===1,'rateR');bad(P.disp<0,'disp');}
  return {P,o,errs,warns,seedFixed};
}
function postWarnings(P,o,n1,n2){ // warning keys, translated at render time
  const w=[];
  if(o.id==='bin'||o.id==='or'||o.id==='rr'){
    const m=Math.min(n1*P.p1,n1*(1-P.p1),n2*P.p2,n2*(1-P.p2));
    if(m<5)w.push('cells');
  }
  if(o.id==='count'&&P.rate0*P.expo<0.2)w.push('lowCount');
  if((o.id==='hr'||o.id==='rmst')&&P.fup===0)w.push('fup0');
  if(o.id==='rmst'&&Math.abs(P.tau-(P.acc+P.fup))<1e-9)w.push('tauMax');
  return w;
}

/* ================= formula strips (with substituted values) ================= */
function formulaStrip(P,o,R){
  const za=zAlpha(P).toFixed(3),zb=qnorm(P.targetPower).toFixed(3),w=L().R.with;
  const zaSym=P.design==='ni'?'z₁₋α':'z₁₋α/₂';
  switch(o.id){
    case 'cont':{const eff=P.design==='ni'?`(Δ+m) = ${fmt((P.mu2-P.mu1)+P.margin)}`:`Δ = ${fmt(Math.abs(P.mu2-P.mu1))}`;
      return `n₁ = (1 + 1/r)·σ²·(${zaSym} + z₁₋β)² / Δ²  ${w}  σ = ${fmt(P.sd)},  ${eff},  r = ${P.ratio},  ${zaSym} = ${za},  z₁₋β = ${zb}  →  <b>n₁ = ${R.n1}</b>`;}
    case 'bin':return P.design==='ni'
      ?`n₁ = (${zaSym}+z₁₋β)²·[p₁q₁ + p₂q₂/r] / (Δ+m)²  ${w}  Δ+m = ${fmt((P.p2-P.p1)+P.margin)}  →  <b>n₁ = ${R.n1}</b>`
      :`n₁ = [ ${zaSym}√((1+1/r)·p̄q̄) + z₁₋β√(p₁q₁+p₂q₂/r) ]² / (p₁−p₂)²  ${w}  p̄ = ${fmt((P.p1+P.ratio*P.p2)/(1+P.ratio))}  →  <b>n₁ = ${R.n1}</b>`;
    case 'or':return `n₁ = (${zaSym}+z₁₋β)²·[1/(p₁q₁) + 1/(r·p₂q₂)] / ln²(OR)  ${w}  p₂ = ${fmt(P.p2)},  ln OR = ${fmt(Math.log(P.or))}  →  <b>n₁ = ${R.n1}</b>`;
    case 'rr':return `n₁ = (${zaSym}+z₁₋β)²·[q₁/p₁ + q₂/(r·p₂)] / ln²(RR)  ${w}  p₂ = ${fmt(P.p2)} (= RR·p₁),  ln RR = ${fmt(Math.log(P.rr))}  →  <b>n₁ = ${R.n1}</b>`;
    case 'hr':{const l1=Math.LN2/P.med1;
      return `Schoenfeld:  D = (${zaSym}+z₁₋β)² / (π₁π₂·ln²HR) = <b>${Math.ceil(R.D)}</b> ${L().R.ev};   N = D / (π₁P₁+π₂P₂)  ${w}  P₁ = ${fmt(hrEventProb(l1,P.acc,P.fup))},  P₂ = ${fmt(hrEventProb(l1*P.hr,P.acc,P.fup))}`;}
    case 'rmst':return `n₁ = (${zaSym}+z₁₋β)²·(v₁ + v₂/r) / Δμ²  ${w}  Δμ(τ=${P.tau}) = ${fmt(R.effRMST)},  v = ∫₀^τ m(t)²·λ dt / (S·G)`;
    case 'count':return `n₁ = (${zaSym}+z₁₋β)²·[(1/(λ₁t)+k) + (1/(λ₂t)+k)/r] / ln²(RR)  ${w}  λ₁t = ${fmt(P.rate0*P.expo)},  k = ${P.disp}  →  <b>n₁ = ${R.n1}</b>`;
  }
}

/* ================= calculation orchestration ================= */
let charts={};
function setProgress(frac){$('prog').classList.add('on');$('progBar').style.width=(100*frac).toFixed(1)+'%';}
function clearProgress(){$('prog').classList.remove('on');$('progBar').style.width='0%';}
function splitN(N,r){const n1=Math.max(2,Math.round(N/(1+r)));return {n1,n2:Math.max(2,N-n1)};}

async function calculate(){
  const {P,o,errs,seedFixed}=buildParams();
  const eb=$('errBox');
  if(errs.length){eb.innerHTML=errs.join('<br>');eb.classList.add('on');return;}
  eb.classList.remove('on');
  const btn=$('btnRun');btn.disabled=true;
  try{
    const R={P,o,seedFixed};
    if(P.solve==='n'){
      if(P.method==='formula'){
        const n1s=solveNGeneric(P,POWFN[o.id]);
        if(n1s===null)throw new Error(L().E.infeasible);
        Object.assign(R,ceilPair(n1s,P.ratio));
      }else{
        const sr=await simSolveN(P,setProgress);
        if(!sr)throw new Error(L().E.infeasible);
        Object.assign(R,sr);
      }
      R.powerAnalytic=POWFN[o.id](R.n1,{...P,ratio:R.n2/R.n1});
      R.Nrand=P.dropout>0?Math.ceil((R.n1+R.n2)/(1-P.dropout/100)):R.N;
    }else{
      const sp=splitN(P.Ntotal,P.ratio);
      Object.assign(R,sp,{N:sp.n1+sp.n2});
      const Peff={...P,ratio:sp.n2/sp.n1};
      R.powerAnalytic=POWFN[o.id](sp.n1,Peff);
      if(P.method==='sim')Object.assign(R,await runSimBatch(Peff,sp.n1,sp.n2,P.nsim,P.seed,setProgress));
    }
    if(o.id==='hr'){const l1=Math.LN2/P.med1;
      R.D=R.n1*hrEventProb(l1,P.acc,P.fup)+R.n2*hrEventProb(l1*P.hr,P.acc,P.fup);}
    if(o.id==='rmst'){const l1=Math.LN2/P.med1,l2=Math.LN2/P.med2;
      R.effRMST=rmstMu(l2,P.tau)-rmstMu(l1,P.tau);
      R.D=R.n1*hrEventProb(l1,P.acc,P.fup)+R.n2*hrEventProb(l2,P.acc,P.fup);}
    R.warns=postWarnings(P,o,R.n1,R.n2);
    lastR=R;
    renderResults(R);
  }catch(e){eb.textContent=e.message;eb.classList.add('on');}
  finally{btn.disabled=false;clearProgress();}
}

/* ================= results rendering ================= */
function ciTxt(p,n){const h=1.96*Math.sqrt(p*(1-p)/n);return `${pct(p)} <small>± ${(100*h).toFixed(1)} pp</small>`;}
function effectVal(P,o,R){
  switch(o.id){
    case 'cont':return fmt(Math.abs(P.mu2-P.mu1)/P.sd,2)+'<small> δ</small>';
    case 'bin':return fmt(P.p2-P.p1,3);
    case 'or':case 'rr':return fmt(P.p2,3);
    case 'hr':return fmt(P.hr,2);
    case 'rmst':return fmt(R.effRMST,2)+`<small> ${L().R.tunits}</small>`;
    case 'count':return fmt(P.rr,2);
  }
}
function renderResults(R){
  const {P,o}=R,isSim=P.method==='sim',T=L(),X=T.R;
  let stats='';
  const st=(lab,val,cls='')=>`<div class="stat"><div class="lab">${lab}</div><div class="val ${cls}">${val}</div></div>`;
  stats+=st(X.ctrl,R.n1,'ctrl')+st(X.trt,R.n2,'trt')+st(X.fpow,pct(R.powerAnalytic));
  if(isSim&&R.pU!==undefined)stats+=st(X.spow+(P.covOn?X.unadj:''),ciTxt(R.pU,R.nsim));
  if(isSim&&P.covOn&&R.pA!=null)stats+=st(X.sadj,ciTxt(R.pA,R.nsim),'trt');
  if(R.D!==undefined)stats+=st(X.events,Math.round(R.D));
  stats+=st(X.eff[o.id],effectVal(P,o,R));

  let head;
  if(P.solve==='n'){
    head=`<div class="n-block"><div class="lab">${X.totalN}</div>
      <div class="N"><span class="nsym">N =</span>${R.N}</div>
      <div class="after">${P.dropout>0?X.rand(R.Nrand,P.dropout):X.noDrop}</div></div>`;
  }else{
    const shown=isSim?(P.covOn&&R.pA!=null?R.pA:R.pU):R.powerAnalytic;
    head=`<div class="n-block"><div class="lab">${X.powerAt(isSim,R.N)}</div>
      <div class="N">${pct(shown)}</div>
      <div class="after">${P.design==='ni'?T.one:T.two} α = ${P.alpha}${isSim?` · ${R.nsim} ${X.reps}`:''}</div></div>`;
  }
  const warnsHtml=R.warns.length?`<div class="warn-note">${R.warns.map(k=>T.W[k]).join('<br>')}</div>`:'';
  let covCard='';
  if(isSim&&P.covOn&&R.pA!=null){
    const za=zAlpha(P);
    const zU=za+qnorm(Math.min(.995,Math.max(.02,R.pU))),zA2=za+qnorm(Math.min(.995,Math.max(.02,R.pA)));
    const saving=zA2>0&&zU>0&&R.pA>R.pU?1-(zU/zA2)**2:null;
    covCard=`<section class="card"><h2><span>${X.cov}</span><span class="t">ρ = ${P.rho.toFixed(2)}</span></h2>
      <div class="cov-body">
        <div class="cov-read">
          <div class="delta">${R.pA>=R.pU?'+':'−'}${(100*Math.abs(R.pA-R.pU)).toFixed(1)} pp</div>
          <div>${X.covPP}</div>
          ${saving!==null&&saving>0.005?`<div style="margin-top:8px">${X.covSave((100*saving).toFixed(0))}</div>`:''}
          ${(o.id==='or'||o.id==='hr')?`<div class="small">${X.covCond}</div>`:''}
        </div>
        <div class="cov-chart-box"><canvas id="covChart" aria-label="${X.unadjL} / ${X.adjL}"></canvas></div>
      </div></section>`;
  }
  $('results').innerHTML=`
   <section class="card">
     <div class="headline">${head}<div class="stat-grid">${stats}</div></div>
     ${warnsHtml}
     <div class="formula-strip">${formulaStrip(P,o,R)}</div>
   </section>
   <section class="card">
     <h2><span>${X.paper}</span><button class="btn" id="copyPaper" type="button">${X.copy}</button></h2>
     <p class="paper-text" id="paperText">${T.paper(R)}</p>
   </section>
   <section class="card">
     <h2>${X.fig}</h2>
     <div class="chart-box"><canvas id="powerChart"></canvas></div>
     <div class="chart-note">${X.note(isSim)}</div>
   </section>
   ${covCard}
   <section class="card"><details class="methods"><summary>${X.methods}</summary>
     <div class="m-body">${T.M[o.id]}${isSim?T.M.mc:''}</div></details></section>`;
  $('copyPaper').addEventListener('click',async e=>{
    const b=e.currentTarget;
    try{await navigator.clipboard.writeText($('paperText').textContent);b.textContent=X.copied;}
    catch(err){const r=document.createRange();r.selectNodeContents($('paperText'));const s=getSelection();s.removeAllRanges();s.addRange(r);}
    setTimeout(()=>{b.textContent=X.copy},2000);
  });
  drawPowerChart(R);
  if(isSim&&P.covOn&&R.pA!=null)drawCovChart(R);
}

/* ================= charts (colours read from the theme tokens) ================= */
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const chartFont={family:"'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif",size:12};
function destroyChart(k){if(charts[k]){charts[k].destroy();delete charts[k];}}
function drawPowerChart(R){
  destroyChart('power');
  if(typeof Chart==='undefined')return;
  const {P,o}=R,r=R.n2/R.n1,X=L().R;
  const ink=cssv('--ink'),muted=cssv('--muted'),grid=cssv('--grid'),ctl=cssv('--ctl'),trt=cssv('--trt'),surf=cssv('--surface');
  Chart.defaults.color=muted;Chart.defaults.borderColor=grid;
  const Nstar=R.N,lo=Math.max(6,Math.round(Nstar*0.3)),hi=Math.round(Nstar*2.1);
  const pts=[],ptsAdj=[];
  for(let i=0;i<=40;i++){
    const N=lo+(hi-lo)*i/40,n1=N/(1+r);
    pts.push({x:Math.round(N),y:100*POWFN[o.id](n1,{...P,ratio:r,covAnalytic:false})});
    if(P.covOn&&o.id==='cont')ptsAdj.push({x:Math.round(N),y:100*POWFN[o.id](n1,{...P,ratio:r,covAnalytic:true})});
  }
  const ds=[{type:'line',label:X.dsF,data:pts,borderColor:ink,borderWidth:2,pointRadius:0,tension:.25}];
  if(ptsAdj.length)ds.push({type:'line',label:X.dsA,data:ptsAdj,borderColor:trt,borderDash:[6,4],borderWidth:2,pointRadius:0,tension:.25});
  if(P.solve==='n')ds.push({type:'line',label:X.dsT,data:[{x:lo,y:100*P.targetPower},{x:hi,y:100*P.targetPower}],borderColor:muted,borderDash:[3,4],borderWidth:1.4,pointRadius:0});
  if(P.method==='sim'&&R.pU!==undefined){
    ds.push({type:'scatter',label:X.dsSU,data:[{x:R.N,y:100*R.pU}],backgroundColor:ctl,borderColor:surf,borderWidth:1.5,pointRadius:7,pointHoverRadius:8});
    if(P.covOn&&R.pA!=null)ds.push({type:'scatter',label:X.dsSA,data:[{x:R.N,y:100*R.pA}],backgroundColor:trt,borderColor:surf,borderWidth:1.5,pointRadius:7,pointHoverRadius:8});
  }else{
    ds.push({type:'scatter',label:X.dsD,data:[{x:R.N,y:100*R.powerAnalytic}],backgroundColor:trt,borderColor:surf,borderWidth:1.5,pointRadius:7});
  }
  const ciBars=(P.method==='sim'&&R.pU!==undefined)?[{p:R.pU,color:ctl},...(P.covOn&&R.pA!=null?[{p:R.pA,color:trt}]:[])]:[];
  charts.power=new Chart($('powerChart'),{
    data:{datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:350},
      scales:{
        x:{type:'linear',title:{display:true,text:X.xax,font:chartFont},grid:{color:grid},ticks:{font:chartFont}},
        y:{min:0,max:100,title:{display:true,text:X.yax,font:chartFont},grid:{color:grid},ticks:{font:chartFont,callback:v=>v+'%'}}},
      plugins:{legend:{labels:{font:{...chartFont,size:11.5},boxWidth:18,color:muted}},
        tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.y.toFixed(1)}% ${X.at} ${c.parsed.x}`}}}},
    plugins:[{id:'ciBars',afterDatasetsDraw(ch){
      if(!ciBars.length)return;
      const {ctx}=ch,xs=ch.scales.x,ys=ch.scales.y;
      ciBars.forEach(b=>{
        const h=1.96*Math.sqrt(b.p*(1-b.p)/R.nsim),x=xs.getPixelForValue(R.N);
        ctx.save();ctx.strokeStyle=b.color;ctx.lineWidth=2;ctx.beginPath();
        ctx.moveTo(x,ys.getPixelForValue(100*Math.min(1,b.p+h)));
        ctx.lineTo(x,ys.getPixelForValue(100*Math.max(0,b.p-h)));
        ctx.stroke();ctx.restore();});
    }}]});
}
function drawCovChart(R){
  destroyChart('cov');
  if(typeof Chart==='undefined')return;
  const X=L().R,grid=cssv('--grid');
  charts.cov=new Chart($('covChart'),{
    type:'bar',
    data:{labels:[X.unadjL,X.adjL],
      datasets:[{data:[100*R.pU,100*R.pA],backgroundColor:[cssv('--ctl'),cssv('--trt')],borderRadius:8,maxBarThickness:64}]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:350},
      scales:{y:{min:0,max:100,ticks:{font:chartFont,callback:v=>v+'%'},grid:{color:grid}},
              x:{ticks:{font:chartFont},grid:{display:false}}},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>{const p=c.parsed.y/100,h=196*Math.sqrt(p*(1-p)/R.nsim);
          return `${c.parsed.y.toFixed(1)}% (${X.ci} ± ${h.toFixed(1)} pp)`;}}}}}});
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(lastR)renderResults(lastR)});

/* ================= language ================= */
function setLanguage(code){
  saveInputs(OUT.find(x=>x.id===S.outcome));
  lang=code;const T=L();
  document.documentElement.lang=code;document.title=T.title;
  $('h1').textContent=T.title;$('sub').textContent=T.sub;$('foot').innerHTML=T.foot;
  $('inputsLab').textContent=T.inputs;$('nav').setAttribute('aria-label',T.outcomeAria);
  document.querySelector('.languages').setAttribute('aria-label',T.lang);
  document.querySelectorAll('.lang').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===code));
  renderNav();renderForm();
  if(lastR)renderResults(lastR);else renderEmpty();
}
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>{setLanguage(b.dataset.lang);try{localStorage.setItem('ssize-lang',lang)}catch(e){}}));

/* ================= init ================= */
setLanguage(lang);
</script>
